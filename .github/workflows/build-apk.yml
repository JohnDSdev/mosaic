name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'buildsrc/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct source project
        run: |
          cat buildsrc/mosaic-source.b64.* | base64 --decode > /tmp/mosaic-source.zip
          mkdir -p /tmp/mosaic-src
          unzip -q /tmp/mosaic-source.zip -d /tmp/mosaic-src

      - name: Apply Android UI fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/mosaic-src/mosaic-notes')
          html = root / 'app/src/main/assets/index.html'
          s = html.read_text()

          # Safe areas for Android edge-to-edge.
          s = s.replace(
              'body{overflow:hidden}',
              'body{overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}',
              1
          )
          s = s.replace(
              'padding:12px max(14px,env(safe-area-inset-right)) 12px max(14px,env(safe-area-inset-left));',
              'padding:12px 14px;'
          )
          s = s.replace(
              'bottom:max(24px,env(safe-area-inset-bottom));',
              'bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 12px));'
          )

          # Remove Android/WebView's blue tap/focus rectangle and use subtle press feedback.
          s = s.replace(
              'button,input,textarea{font:inherit}button{color:inherit}',
              'button,input,textarea{font:inherit}button{color:inherit;-webkit-tap-highlight-color:transparent}button:focus,button:focus-visible{outline:none;box-shadow:none}'
          )
          s = s.replace(
              '.iconbtn{width:44px;height:44px;border:0;border-radius:15px;background:transparent;display:grid;place-items:center;cursor:pointer;font-size:22px}.iconbtn:hover{background:#ffffff0d}',
              '.iconbtn{width:44px;height:44px;border:0;border-radius:15px;background:transparent;display:grid;place-items:center;cursor:pointer;color:#f3f5fb;-webkit-tap-highlight-color:transparent;transition:background .14s ease,transform .12s ease}.iconbtn:hover{background:#ffffff0d}.iconbtn:active{background:#ffffff12;transform:scale(.97)}.iconbtn:focus,.iconbtn:focus-visible{outline:none;box-shadow:none}.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.iconFill{fill:currentColor;stroke:none}'
          )
          s = s.replace(
              '.tool{min-width:38px;height:38px;padding:0 10px;border:0;border-radius:11px;background:transparent;cursor:pointer;font-weight:650}.tool:hover{background:#ffffff10}',
              '.tool{width:42px;min-width:42px;height:42px;padding:0;border:0;border-radius:13px;background:transparent;cursor:pointer;font-weight:650;display:inline-flex;align-items:center;justify-content:center;color:#f3f5fb;-webkit-tap-highlight-color:transparent;transition:background .14s ease,transform .12s ease}.tool:hover{background:#ffffff10}.tool:active{background:#ffffff14;transform:scale(.97)}.tool:focus,.tool:focus-visible{outline:none;box-shadow:none}'
          )

          back = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/><path d="M9 12h8"/></svg>'
          search = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>'
          sync = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M19 11a7 7 0 0 0-12-3"/><path d="M5 13a7 7 0 0 0 12 3"/></svg>'
          dots = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle class="iconFill" cx="12" cy="5" r="1.7"/><circle class="iconFill" cx="12" cy="12" r="1.7"/><circle class="iconFill" cx="12" cy="19" r="1.7"/></svg>'
          close = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
          plus = '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:25px;height:25px"><path d="M12 5v14M5 12h14"/></svg>'

          s = s.replace('<button class="iconbtn" id="backBtn" title="Back" aria-label="Back">‹</button>', f'<button class="iconbtn" id="backBtn" title="Back" aria-label="Back">{back}</button>')
          s = s.replace('<div class="searchWrap"><span>⌕</span><input id="searchInput" placeholder="Search notes" autocomplete="off"><button class="iconbtn hidden" id="clearSearch" style="width:32px;height:32px" aria-label="Clear search">×</button></div>', f'<div class="searchWrap"><span style="display:grid;place-items:center;color:#aaa">{search}</span><input id="searchInput" placeholder="Search notes" autocomplete="off"><button class="iconbtn hidden" id="clearSearch" style="width:32px;height:32px" aria-label="Clear search">{close}</button></div>')
          s = s.replace('<button class="iconbtn hideMobile" id="syncBtn" title="Sync now" aria-label="Sync now">↻</button>', f'<button class="iconbtn hideMobile" id="syncBtn" title="Sync now" aria-label="Sync now">{sync}</button>')
          s = s.replace('<button class="iconbtn" id="settingsBtn" title="Settings" aria-label="Settings">⋮</button>', f'<button class="iconbtn" id="settingsBtn" title="Settings" aria-label="Settings">{dots}</button>')
          s = s.replace('<button class="fab" id="fab" aria-label="Add">+</button>', f'<button class="fab" id="fab" aria-label="Add">{plus}</button>')

          icons = {
              '<b>B</b>':'<svg class="icon" viewBox="0 0 24 24"><path d="M8 5h5a3.5 3.5 0 0 1 0 7H8z"/><path d="M8 12h6a3.5 3.5 0 0 1 0 7H8z"/></svg>',
              '<i>I</i>':'<svg class="icon" viewBox="0 0 24 24"><path d="M10 5h8M6 19h8M14 5l-4 14"/></svg>',
              '• list':'<svg class="icon" viewBox="0 0 24 24"><circle class="iconFill" cx="5" cy="7" r="1.5"/><circle class="iconFill" cx="5" cy="12" r="1.5"/><circle class="iconFill" cx="5" cy="17" r="1.5"/><path d="M10 7h9M10 12h9M10 17h9"/></svg>',
              '1. list':'<svg class="icon" viewBox="0 0 24 24"><path d="M4 6h2v5M4 11h3M4 15h3l-3 4h3M11 7h9M11 12h9M11 17h9"/></svg>',
              '☐ todo':'<svg class="icon" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M8 12l2.5 2.5L16 9"/></svg>',
              '↗ link':'<svg class="icon" viewBox="0 0 24 24"><path d="M10 14l4-4"/><path d="M8.5 16.5l-1 1a3.5 3.5 0 0 1-5-5l3-3a3.5 3.5 0 0 1 5 0"/><path d="M15.5 7.5l1-1a3.5 3.5 0 0 1 5 5l-3 3a3.5 3.5 0 0 1-5 0"/></svg>',
              '▧ image':'<svg class="icon" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="9" r="1.7"/><path d="M5.5 17l4.2-4.2 3.1 3.1 2.4-2.4 3.3 3.5"/></svg>',
              '&lt;/&gt;':'<svg class="icon" viewBox="0 0 24 24"><path d="M8.5 7L4 12l4.5 5M15.5 7L20 12l-4.5 5M13.5 5l-3 14"/></svg>',
              '●':'<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle class="iconFill" cx="12" cy="12" r="3.5"/></svg>',
              'Tx':'<svg class="icon" viewBox="0 0 24 24"><path d="M5 19L19 5M14 5H7l3 7M11 19h6"/></svg>'
          }
          for old, new in icons.items():
              s = s.replace('>'+old+'</button>', '>'+new+'</button>')

          html.write_text(s)
          # Keep standalone website source in sync with APK source.
          (root / 'index.html').write_text(s)

          manifest = root / 'app/src/main/AndroidManifest.xml'
          ms = manifest.read_text()
          if 'android:windowSoftInputMode="adjustResize"' not in ms:
              ms = ms.replace('android:screenOrientation="unspecified">', 'android:screenOrientation="unspecified"\n            android:windowSoftInputMode="adjustResize">')
          manifest.write_text(ms)

          gradle = root / 'app/build.gradle.kts'
          gs = gradle.read_text().replace('versionCode = 1', 'versionCode = 4').replace('versionName = "1.0.0"', 'versionName = "1.0.3"')
          gradle.write_text(gs)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: /tmp/mosaic-src/mosaic-notes
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK
        run: cp /tmp/mosaic-src/mosaic-notes/app/build/outputs/apk/debug/app-debug.apk ./Mosaic-Notes.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-notes-apk
          path: Mosaic-Notes.apk
          if-no-files-found: error
