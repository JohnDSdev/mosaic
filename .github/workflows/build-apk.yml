name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'incoming/latest-html.part*'
      - 'payload/MainActivity-v105.java'
      - 'payload/patch-android-v106.py'
      - 'payload/patch-android-v111-hide-scrollbars.py'
      - 'buildsrc/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct Android source project
        run: |
          cat buildsrc/mosaic-source.b64.* | base64 --decode > /tmp/mosaic-source.zip
          rm -rf /tmp/mosaic-src
          mkdir -p /tmp/mosaic-src
          unzip -q /tmp/mosaic-source.zip -d /tmp/mosaic-src

      - name: Install exact uploaded HTML
        run: |
          cat incoming/latest-html.part00 incoming/latest-html.part01 incoming/latest-html.part02 incoming/latest-html.part03 incoming/latest-html.part04 incoming/latest-html.part05 incoming/latest-html.part06 incoming/latest-html.part07 > /tmp/mosaic-latest.html.gz.b64
          base64 --decode /tmp/mosaic-latest.html.gz.b64 | gzip -dc > /tmp/mosaic-latest.html
          echo '533f161e20e9ec13bb214a9bc02bcebd8f932cfed453e013e83f4f586dd2ba76  /tmp/mosaic-latest.html' | sha256sum -c -
          cp /tmp/mosaic-latest.html /tmp/mosaic-src/mosaic-notes/app/src/main/assets/index.html
          cp /tmp/mosaic-latest.html /tmp/mosaic-src/mosaic-notes/index.html

      - name: Install Android shell
        run: |
          cp payload/MainActivity-v105.java /tmp/mosaic-src/mosaic-notes/app/src/main/java/com/mosaicnotes/app/MainActivity.java
          python3 payload/patch-android-v106.py
          python3 payload/patch-android-v111-hide-scrollbars.py
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/mosaic-src/mosaic-notes')
          manifest = root / 'app/src/main/AndroidManifest.xml'
          ms = manifest.read_text().replace(
              'android:screenOrientation="unspecified">',
              'android:screenOrientation="unspecified"\n'
              '            android:configChanges="orientation|screenSize|smallestScreenSize|keyboard|keyboardHidden|uiMode"\n'
              '            android:windowSoftInputMode="adjustResize">'
          )
          manifest.write_text(ms)
          gradle = root / 'app/build.gradle.kts'
          gs = gradle.read_text().replace('versionCode = 1', 'versionCode = 12').replace('versionName = "1.0.0"', 'versionName = "1.0.11"')
          gradle.write_text(gs)
          PY

      - name: Verify app sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('/tmp/mosaic-src/mosaic-notes/app/src/main/assets/index.html')
          b=p.read_bytes(); s=b.decode()
          if hashlib.sha256(b).hexdigest()!='533f161e20e9ec13bb214a9bc02bcebd8f932cfed453e013e83f4f586dd2ba76':
              raise SystemExit('Bundled HTML does not exactly match uploaded HTML')
          for token in ['AndroidBridge?.saveFile','AndroidBridge?.checkSpelling','mosaic_notes_last_view_v1','position:fixed;left:0;right:0;top:auto;bottom:0']:
              if token not in s: raise SystemExit('HTML missing '+token)
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          if not m: raise SystemExit('Script block missing')
          Path('/tmp/mosaic-latest.js').write_text(m.group(1))
          java=Path('/tmp/mosaic-src/mosaic-notes/app/src/main/java/com/mosaicnotes/app/MainActivity.java').read_text()
          for token in ['checkSpelling','SpellCheckerSession','setDecorFitsSystemWindows','WindowInsets.Type.ime','SOFT_INPUT_ADJUST_NOTHING','OVER_SCROLL_NEVER','setVerticalScrollBarEnabled(false)','setHorizontalScrollBarEnabled(false)','mosaic-android-hide-scrollbars']:
              if token not in java: raise SystemExit('Android shell missing '+token)
          PY
          node --check /tmp/mosaic-latest.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: /tmp/mosaic-src/mosaic-notes
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect artifact
        run: |
          cp /tmp/mosaic-src/mosaic-notes/app/build/outputs/apk/debug/app-debug.apk ./Mosaic-Notes-v1.0.11.apk
          cp /tmp/mosaic-src/mosaic-notes/index.html ./Mosaic-Notes-v1.0.11.html
          sha256sum Mosaic-Notes-v1.0.11.apk Mosaic-Notes-v1.0.11.html

      - name: Upload APK and HTML
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-notes-v1.0.11
          path: |
            Mosaic-Notes-v1.0.11.apk
            Mosaic-Notes-v1.0.11.html
          if-no-files-found: error
