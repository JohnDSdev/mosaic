name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'payload/**'
      - 'buildsrc/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct source project
        run: |
          cat buildsrc/mosaic-source.b64.* | base64 --decode > /tmp/mosaic-source.zip
          mkdir -p /tmp/mosaic-src
          unzip -q /tmp/mosaic-source.zip -d /tmp/mosaic-src

      - name: Install v1.0.4 app source
        run: |
          base64 --decode payload/mosaic-v104.html.gz.b64 | gzip -d > /tmp/mosaic-src/mosaic-notes/app/src/main/assets/index.html
          cp /tmp/mosaic-src/mosaic-notes/app/src/main/assets/index.html /tmp/mosaic-src/mosaic-notes/index.html
          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/mosaic-src/mosaic-notes')

          manifest = root / 'app/src/main/AndroidManifest.xml'
          ms = manifest.read_text()
          ms = ms.replace(
              'android:screenOrientation="unspecified">',
              'android:screenOrientation="unspecified"\n'
              '            android:configChanges="orientation|screenSize|smallestScreenSize|keyboard|keyboardHidden|uiMode"\n'
              '            android:windowSoftInputMode="adjustResize">'
          )
          manifest.write_text(ms)

          activity = root / 'app/src/main/java/com/mosaicnotes/app/MainActivity.java'
          a = activity.read_text()
          if 'SOFT_INPUT_ADJUST_RESIZE' not in a:
              a = a.replace(
                  '        super.onCreate(savedInstanceState);\n',
                  '        super.onCreate(savedInstanceState);\n'
                  '        getWindow().setSoftInputMode(android.view.WindowManager.LayoutParams.SOFT_INPUT_ADJUST_RESIZE);\n',
                  1
              )
          activity.write_text(a)

          gradle = root / 'app/build.gradle.kts'
          gs = gradle.read_text().replace('versionCode = 1', 'versionCode = 5').replace('versionName = "1.0.0"', 'versionName = "1.0.4"')
          gradle.write_text(gs)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: /tmp/mosaic-src/mosaic-notes
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect files
        run: |
          cp /tmp/mosaic-src/mosaic-notes/app/build/outputs/apk/debug/app-debug.apk ./Mosaic-Notes-v1.0.4.apk
          cp /tmp/mosaic-src/mosaic-notes/index.html ./Mosaic-Notes-v1.0.4.html

      - name: Upload APK and HTML
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-notes-v1.0.4
          path: |
            Mosaic-Notes-v1.0.4.apk
            Mosaic-Notes-v1.0.4.html
          if-no-files-found: error
