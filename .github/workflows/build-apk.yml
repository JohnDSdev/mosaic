name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'buildsrc/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Reconstruct source project
        run: |
          cat buildsrc/mosaic-source.b64.* | base64 --decode > /tmp/mosaic-source.zip
          mkdir -p /tmp/mosaic-src
          unzip -q /tmp/mosaic-source.zip -d /tmp/mosaic-src
      - name: Fix Android system bar insets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/mosaic-src/mosaic-notes/app/src/main/java/com/mosaicnotes/app/MainActivity.java')
          s = p.read_text()
          if 'import android.os.Build;' not in s:
              s = s.replace('import android.os.Bundle;\n', 'import android.os.Bundle;\nimport android.os.Build;\n')
          if 'import android.view.WindowInsets;' not in s:
              s = s.replace('import android.webkit.WebViewClient;\n', 'import android.webkit.WebViewClient;\nimport android.view.WindowInsets;\n')
          old = '''        webView = new WebView(this);\n        setContentView(webView);\n\n        WebSettings s = webView.getSettings();\n'''
          new = '''        webView = new WebView(this);\n        setContentView(webView);\n\n        // Android 15 enforces edge-to-edge for apps targeting API 35.\n        // Apply the real system bar insets to the WebView so the app's\n        // toolbar/editor never sits underneath the status or navigation bars.\n        webView.setOnApplyWindowInsetsListener((view, insets) -> {\n            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\n                android.graphics.Insets bars = insets.getInsets(WindowInsets.Type.systemBars());\n                view.setPadding(bars.left, bars.top, bars.right, bars.bottom);\n            } else {\n                view.setPadding(\n                        insets.getSystemWindowInsetLeft(),\n                        insets.getSystemWindowInsetTop(),\n                        insets.getSystemWindowInsetRight(),\n                        insets.getSystemWindowInsetBottom());\n            }\n            return insets;\n        });\n        webView.requestApplyInsets();\n\n        WebSettings s = webView.getSettings();\n'''
          if old not in s and 'setOnApplyWindowInsetsListener' not in s:
              raise SystemExit('Could not find WebView setup anchor')
          if 'setOnApplyWindowInsetsListener' not in s:
              s = s.replace(old, new)
          p.write_text(s)

          g = Path('/tmp/mosaic-src/mosaic-notes/app/build.gradle.kts')
          gs = g.read_text().replace('versionCode = 1', 'versionCode = 2').replace('versionName = "1.0.0"', 'versionName = "1.0.1"')
          g.write_text(gs)
          PY
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        working-directory: /tmp/mosaic-src/mosaic-notes
        run: gradle --no-daemon :app:assembleDebug
      - name: Copy APK
        run: cp /tmp/mosaic-src/mosaic-notes/app/build/outputs/apk/debug/app-debug.apk ./Mosaic-Notes.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-notes-apk
          path: Mosaic-Notes.apk
          if-no-files-found: error
