name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'payload/**'
      - 'buildsrc/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct source project
        run: |
          cat buildsrc/mosaic-source.b64.* | base64 --decode > /tmp/mosaic-source.zip
          rm -rf /tmp/mosaic-src
          mkdir -p /tmp/mosaic-src
          unzip -q /tmp/mosaic-source.zip -d /tmp/mosaic-src

      - name: Apply Mosaic v1.0.9 web fixes
        run: |
          HTML=/tmp/mosaic-src/mosaic-notes/app/src/main/assets/index.html
          python3 payload/prepatch-v103.py "$HTML"
          python3 payload/patch-v104.py "$HTML"
          python3 payload/patch-v105.py
          python3 payload/patch-v106.py
          python3 payload/patch-v107.py
          python3 payload/patch-v108.py
          python3 payload/patch-v109.py "$HTML"
          cp "$HTML" /tmp/mosaic-src/mosaic-notes/index.html

      - name: Install Android v1.0.9 shell
        run: |
          cp payload/MainActivity-v105.java /tmp/mosaic-src/mosaic-notes/app/src/main/java/com/mosaicnotes/app/MainActivity.java
          python3 payload/patch-android-v106.py
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/mosaic-src/mosaic-notes')

          manifest = root / 'app/src/main/AndroidManifest.xml'
          ms = manifest.read_text().replace(
              'android:screenOrientation="unspecified">',
              'android:screenOrientation="unspecified"\n'
              '            android:configChanges="orientation|screenSize|smallestScreenSize|keyboard|keyboardHidden|uiMode"\n'
              '            android:windowSoftInputMode="adjustResize">'
          )
          manifest.write_text(ms)

          gradle = root / 'app/build.gradle.kts'
          gs = gradle.read_text().replace('versionCode = 1', 'versionCode = 10').replace('versionName = "1.0.0"', 'versionName = "1.0.9"')
          gradle.write_text(gs)
          PY

      - name: Verify sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/mosaic-src/mosaic-notes/index.html')
          s=p.read_text()
          needed=['wordCount','spellToggle','animToggle','handleEditorKeydown','mosaic_notes_last_view_v1','mosaic-spelling','scheduleSpellcheck','editorMode','todo-text','desktopNav','renderDesktopNav','desktopSearchHTML','desktopSearchInput','desktopEditor','goUpOneLevel','.topbar .searchWrap{display:none}','position:fixed;left:0;right:0;top:auto;bottom:0','(max-height:500px) and (hover:none)']
          missing=[x for x in needed if x not in s]
          if missing: raise SystemExit('Missing expected features: '+', '.join(missing))
          if '.toolbar{order:3;position:fixed;left:0;right:0;bottom:0;' in s:
              raise SystemExit('Regression: full-screen mobile toolbar bug is still present')
          if '--keyboard-inset' in s or 'visualViewport?.addEventListener' in s:
              raise SystemExit('Old jittery visualViewport keyboard positioning is still present')
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          if not m: raise SystemExit('Script block missing')
          Path('/tmp/mosaic-v109.js').write_text(m.group(1))
          java=Path('/tmp/mosaic-src/mosaic-notes/app/src/main/java/com/mosaicnotes/app/MainActivity.java').read_text()
          for token in ['checkSpelling','SpellCheckerSession','setDecorFitsSystemWindows','WindowInsets.Type.ime','SOFT_INPUT_ADJUST_NOTHING','OVER_SCROLL_NEVER']:
              if token not in java: raise SystemExit('Android shell missing '+token)
          PY
          node --check /tmp/mosaic-v109.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: /tmp/mosaic-src/mosaic-notes
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect files
        run: |
          cp /tmp/mosaic-src/mosaic-notes/app/build/outputs/apk/debug/app-debug.apk ./Mosaic-Notes-v1.0.9.apk
          cp /tmp/mosaic-src/mosaic-notes/index.html ./Mosaic-Notes-v1.0.9.html

      - name: Upload APK and HTML
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-notes-v1.0.9
          path: |
            Mosaic-Notes-v1.0.9.apk
            Mosaic-Notes-v1.0.9.html
          if-no-files-found: error
