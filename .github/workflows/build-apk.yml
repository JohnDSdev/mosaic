name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'buildsrc/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct source project
        run: |
          cat buildsrc/mosaic-source.b64.* | base64 --decode > /tmp/mosaic-source.zip
          mkdir -p /tmp/mosaic-src
          unzip -q /tmp/mosaic-source.zip -d /tmp/mosaic-src

      - name: Apply Android safe-area fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/mosaic-src/mosaic-notes')
          html = root / 'app/src/main/assets/index.html'
          s = html.read_text()

          # Let WebView's CSS safe-area values keep the whole app inside the
          # status/navigation bars. The previous native WebView padding approach
          # was unreliable because WebView manages its own visual/layout viewports.
          old = 'body{overflow:hidden}'
          new = '''body{overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}'''
          if old not in s:
              raise SystemExit('Could not find body CSS anchor')
          s = s.replace(old, new, 1)

          # The body now owns left/right safe-area padding, so don't apply it a
          # second time to the top bar.
          s = s.replace(
              'padding:12px max(14px,env(safe-area-inset-right)) 12px max(14px,env(safe-area-inset-left));',
              'padding:12px 14px;'
          )

          # Keep fixed controls above gesture/3-button navigation even though
          # fixed-position elements are not affected by body padding.
          s = s.replace(
              'bottom:max(24px,env(safe-area-inset-bottom));',
              'bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 12px));'
          )

          html.write_text(s)

          manifest = root / 'app/src/main/AndroidManifest.xml'
          ms = manifest.read_text()
          ms = ms.replace(
              'android:screenOrientation="unspecified">',
              'android:screenOrientation="unspecified"\n            android:windowSoftInputMode="adjustResize">'
          )
          manifest.write_text(ms)

          gradle = root / 'app/build.gradle.kts'
          gs = gradle.read_text().replace('versionCode = 1', 'versionCode = 3').replace('versionName = "1.0.0"', 'versionName = "1.0.2"')
          gradle.write_text(gs)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: /tmp/mosaic-src/mosaic-notes
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK
        run: cp /tmp/mosaic-src/mosaic-notes/app/build/outputs/apk/debug/app-debug.apk ./Mosaic-Notes.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mosaic-notes-apk
          path: Mosaic-Notes.apk
          if-no-files-found: error
